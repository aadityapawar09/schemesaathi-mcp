[project]
name = "schemesaathi-mcp"
version = "0.1.0"
description = "A beginner-friendly MCP server for exploring Indian government schemes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
